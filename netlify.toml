[build]
  command = "npm run build"
  publish = "apps/editor/dist"

[build.environment]
  NODE_VERSION = "24.20.0"
  NPM_VERSION = "12.0.2"

# Non-forced SPA fallback: real files shadow this rewrite, deep links load the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
