name: Focused CI

on:
  pull_request:
    branches:
      - develop
      - main
      - chore/docs-qa-sdk-tooling
      - fix/docs-qa-01-root-checks
      - docs/docs-qa-02-overview-boundaries
      - docs/docs-qa-03-headless-deployment
      - docs/docs-qa-04-functional-guide
      - docs/docs-qa-05-agent-qa
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  focused-ci:
    name: Focused package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.x
          package-manager-cache: false
      - name: Pin and verify npm
        run: |
          npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "12.0.2"
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare generated validator
        run: npm run validator:prepare
      - name: Test SceneDocument, runtime, commands, and persistence adapters
        run: npx vitest run --project core packages/scene-document/tests packages/runtime/tests packages/commands/tests packages/persistence/tests packages/persistence-indexeddb/tests packages/persistence-fs/tests packages/export/tests packages/webmcp-adapter/tests apps/headless-mcp/tests apps/editor/tests/durable-draft-workspace.test.ts apps/editor/tests/editor-durable-editing.test.ts apps/editor/tests/editor-browser-agent-workspace.test.ts apps/editor/tests/editor-image-import-workflow.test.ts apps/editor/tests/editor-import-workflow.test.ts apps/editor/tests/editor-session.test.ts apps/editor/tests/browser-editor-session.test.ts apps/editor/tests/browser-png-platform.test.ts apps/editor/tests/editor-frame.test.ts
      - name: Prepare validator for editor tests
        run: npm run validator:prepare
      - name: Test editor command boundary
        run: npx vitest run --project ui apps/editor/tests/durable-command-bridge.test.tsx apps/editor/tests/browser-agent-workspace-port.test.tsx apps/editor/tests/export-build-authority.test.tsx apps/editor/tests/canonical-reference-plan.test.tsx apps/editor/tests/durable-png-import.test.tsx apps/editor/tests/verified-png-decode.test.tsx apps/editor/tests/png-image-cache.test.tsx apps/editor/tests/canonical-reference-prehydration.test.tsx apps/editor/tests/canonical-draft-publication.test.tsx apps/editor/tests/durable-draft-identity.test.tsx apps/editor/tests/referenced-revision-envelope.test.tsx apps/editor/tests/canonical-draft-content-parity.test.tsx apps/editor/tests/canonical-draft-reload.test.tsx apps/editor/tests/canonical-draft-republication.test.tsx apps/editor/tests/editor-import-controls.test.tsx apps/editor/tests/editor-json-import-controls.test.tsx apps/editor/tests/editor-png-import-controls.test.tsx apps/editor/tests/editor-rectangle-controls.test.tsx apps/editor/tests/editor-element-inspector.test.tsx apps/editor/tests/editor-position-controls.test.tsx apps/editor/tests/editor-dimension-controls.test.tsx apps/editor/tests/editor-opacity-controls.test.tsx apps/editor/tests/editor-fill-color-controls.test.tsx
      - name: Smoke-test Canvas2D entrypoint
        run: npx vitest run --project integration packages/renderer-canvas2d/tests/entrypoint.smoke.test.ts
      - name: Test headless MCP stdio and static container contract
        run: npx vitest run --project integration apps/headless-mcp/tests-integration
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Test browser PNG platform in Chromium
        run: npm run test:browser
      - name: Typecheck focused packages
        run: npm run typecheck
      - name: Build headless MCP smoke image
        timeout-minutes: 20
        run: docker build --progress=plain -f apps/headless-mcp/Dockerfile -t particle-studio-headless-mcp:d1-smoke .
      - name: Smoke-test headless MCP container across four sessions
        timeout-minutes: 15
        env:
          PARTICLE_STUDIO_SMOKE_EVIDENCE: ${{ runner.temp }}/particle-studio-container-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/container-smoke/smoke.mjs
