name: Close issues referenced by a merged pull request
# autoclose-script-start
on:
  pull_request_target:
    types: [closed]
    branches: [develop]
permissions:
  issues: write
  pull-requests: read
jobs:
  close-referenced-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close referenced issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 0
          script: |
            const { owner, repo } = context.repo;
            const expectedRepo = `${owner}/${repo}`.toLowerCase();
            const prNumber = context.payload?.pull_request?.number;
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.info('autoclose: no pull request number in payload; skipping');
              return;
            }
            const got = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const pull = got.data;
            if (pull.number !== prNumber) return;
            if (pull.merged !== true) return;
            if (typeof pull.merged_at !== 'string' || pull.merged_at === '') return;
            if (pull.base?.ref !== 'develop') return;
            if (String(pull.base?.repo?.full_name ?? '').toLowerCase() !== expectedRepo) return;
            if (typeof pull.body !== 'string' || pull.body === '') return;
            const eventBody = context.payload?.pull_request?.body;
            if (typeof eventBody !== 'string' || eventBody !== pull.body) {
              core.warning('autoclose: event body changed or missing since closed; skipping');
              return;
            }
            const keywords = ['close', 'closes', 'closed', 'fix', 'fixes', 'fixed', 'resolve', 'resolves', 'resolved'];
            const guard = '\u0000';
            const lines = pull.body.replace(/<!--[\s\S]*?(?:-->|$)/g, guard).split('\n');
            const kept = [];
            let fenceChar = '';
            let fenceLength = 0;
            for (const line of lines) {
              const fence = line.match(/^ {0,3}(`{3,}|~{3,})/);
              const closes = fence && fence[1][0] === fenceChar && fence[1].length >= fenceLength && line.slice(fence[0].length).trim() === '';
              if (fenceChar && closes) { fenceChar = ''; fenceLength = 0; kept.push(guard); continue; }
              const inert = /^( {4,}|\t)/.test(line) || /^ {0,3}>/.test(line);
              if (fenceChar || fence || inert) {
                if (fence && !fenceChar) { fenceChar = fence[1][0]; fenceLength = fence[1].length; }
                kept.push(guard);
              } else {
                kept.push(line);
              }
            }
            const masked = kept.join('\n').replace(/(?<!`)(`+)(?!`)[\s\S]*?(?<!`)\1(?!`)/g, guard);
            const reference = new RegExp(
              `\\b(?:${keywords.join('|')})\\b\\s*:?\\s*(?:#([0-9]+)(?![\\w.\\/-])|([A-Za-z0-9_.-]+\\/[A-Za-z0-9_.-]+)#([0-9]+)(?![\\w.\\/-]))`,
              'gi',
            );
            const ids = new Set();
            for (const match of masked.matchAll(reference)) {
              const qualifier = match[2];
              if (qualifier !== undefined && qualifier.toLowerCase() !== expectedRepo) continue;
              const id = Number(match[1] ?? match[3]);
              if (Number.isSafeInteger(id) && id > 0) ids.add(id);
            }
            for (const id of ids) {
              const issue = (await github.rest.issues.get({ owner, repo, issue_number: id })).data;
              if (issue.number !== id) {
                throw new Error(`autoclose: issue identity mismatch for #${id}`);
              }
              if (issue.pull_request) continue;
              if (issue.state !== 'open') continue;
              await github.rest.issues.update({ owner, repo, issue_number: id, state: 'closed', state_reason: 'completed' });
              core.info(`autoclose: closed #${id}`);
            }
# autoclose-script-end
