name: Check issue autoclose
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/close-issue-on-merge.yml
      - .github/workflows/check-issue-autoclose.yml
      - tests/close-issue-on-merge.test.mjs
      - docs/automation/close-issue-on-merge.md
  push:
    branches: [main]
    paths:
      - .github/workflows/close-issue-on-merge.yml
      - .github/workflows/check-issue-autoclose.yml
      - tests/close-issue-on-merge.test.mjs
      - docs/automation/close-issue-on-merge.md
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.x
      - run: node --test tests/close-issue-on-merge.test.mjs
